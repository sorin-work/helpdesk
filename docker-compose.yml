name: helpdesk

# Local Postgres for development. The API and web app run on the host for now.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5450}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U helpdesk -d helpdesk']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
