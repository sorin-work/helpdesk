name: helpdesk

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk}
      POSTGRES_DB: helpdesk
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5450}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U helpdesk -d helpdesk']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://helpdesk:${POSTGRES_PASSWORD:-helpdesk}@db:5432/helpdesk
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-0123456789}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '4410:4410'

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - api
    ports:
      - '5190:80'

volumes:
  db-data:
